[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastcms-sdk"
version = "0.1.0"
description = "Official Python SDK for FastCMS — the open-source BaaS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FastCMS Contributors" }]
keywords = ["fastcms", "baas", "sdk", "backend-as-a-service"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
realtime = ["httpx-sse>=0.4"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",   # httpx mock
]

[project.urls]
Homepage = "https://github.com/fastcms/fastcms"
Repository = "https://github.com/fastcms/fastcms"

[tool.hatch.build.targets.wheel]
packages = ["fastcms"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
